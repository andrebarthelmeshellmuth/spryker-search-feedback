namespace: SprykerCommunityTest\Zed\SearchFeedbackGuiPresentation

paths:
    tests: .
    data: _data
    support: _support
    output: _output

coverage:
    enabled: true
    remote: false
    include:
        - 'packages/spryker-community/search-feedback/src/*'

# Kept as its own module directory, sibling to Zed/SearchFeedbackGui, rather than a Presentation/
# subfolder of it: that module's existing `Zed` suite has `path: .`, which recursively picks up every
# file under it regardless of suite boundaries in codeception.yml — nesting a WebDriver suite in there
# would make that suite try (and fail) to load these Cests too. Same gotcha hit building all 3 sibling
# packages' own Presentation suites first.
suites:
    Presentation:
        path: Presentation
        actor: SearchFeedbackGuiPresentationTester
        modules:
            enabled:
                - Asserts
                - \PyzTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\Application\Helper\ZedHelper
                - \SprykerTest\Shared\Config\Helper\ConfigInit
                - \SprykerTest\Shared\Testify\Helper\LocatorHelper:
                    projectNamespaces: ['Pyz']
                - WebDriver:
                    url: ''
                    browser: chrome
                    window_size: 1920x1080
                    # host: webdriver (the real docker-compose service name), not the demoshop's usual
                    # 0.0.0.0 literal — WebDriver's own _before() hook opens the session eagerly, before
                    # ZedHelper::amZed()'s runtime host reconfigure ever runs. Capabilities key is
                    # goog:chromeOptions (bare chromeOptions silently does nothing); headless/no-sandbox/
                    # disable-dev-shm-usage are all required or Chrome crashes on launch in this container.
                    # Full recipe worked out building search-debug/search-ranking/search-ranking-optimizer's
                    # own Presentation suites first.
                    host: webdriver
                    restart: false
                    capabilities:
                        goog:chromeOptions:
                            args: ['--headless', '--disable-gpu', '--disable-dev-shm-usage', '--no-sandbox']
